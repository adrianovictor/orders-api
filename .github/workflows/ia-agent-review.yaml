name: IA Agente Code Reviewer com Gemini

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write  # Permissão para a action comentar no PR (essencial)

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gemini AI as a reviewer
        # Ação popular e bem mantida para revisão de código com Gemini
        uses: stefan-stanev/gemini-code-reviewer@v1.0.2
        with:
          # 1. Substitua o segredo da OpenAI pelo da Gemini
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}

          # 2. O token do GitHub continua sendo necessário
          github_token: ${{ secrets.GITHUB_TOKEN }}

          # 3. Especifique o modelo do Gemini. 'gemini-1.5-flash' é rápido e eficiente.
          model: 'gemini-1.5-flash-latest'

          # 4. Parâmetros opcionais similares aos que você já usava
          temperature: 0.2
          max_tokens: 2048 # Opcional, a ação geralmente gerencia isso bem
