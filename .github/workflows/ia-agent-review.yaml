name: Code Review by Gemini AI

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v3

      - name: Get PR diff
        id: get_diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git diff origin/${{ github.event.pull_request.base.ref }} origin/${{ github.event.pull_request.head.ref }} > diff.txt
          echo "pull_request_diff<<EOF" >> $GITHUB_OUTPUT
          cat diff.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Code Review by Gemini AI
        uses: rubensflinco/gemini-code-review-action@1.0.5
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pull_request_number: ${{ github.event.pull_request.number }}
          git_commit_hash: ${{ github.event.pull_request.head.sha }}
          model: "gemini-1.5-flash-latest"
          pull_request_diff: ${{ steps.get_diff.outputs.pull_request_diff }}
          pull_request_diff_chunk_size: "3500"
          extra_prompt: |
            Sempre responda em português brasileiro.
            Separe os comentários por **arquivo**, informando o nome do arquivo como título (ex: `Arquivo: OrdersService.Domain.Entities.Customer.cs`).
            Para cada comentário, siga o padrão:
            - Linha(s): [linhas afetadas]
            - Problema: [descrição]
            - Severidade: [Alta, Média, Baixa]
            - Sugestão: [como melhorar]

            Se detectar **problemas críticos** (que podem causar falha de execução, bugs graves ou violação de princípios de arquitetura), sinalize claramente com a tag: `🚨 PROBLEMA CRÍTICO`.

      - name: Fail if critical issue is found
        run: |
          if grep -q "🚨 PROBLEMA CRÍTICO" diff.txt; then
            echo "🚨 Problema crítico detectado pelo Gemini. PR bloqueada."
            exit 1
          fi
